name: SignBridgeApp
options:
  bundleIdPrefix: com.kerem
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
packages:
  Core:
    path: .
targets:
  SignBridgeApp:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - App/Sources
    dependencies:
      - package: Core
        product: SignCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keremgok.udfeimza
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        INFOPLIST_KEY_CFBundleDisplayName: "USB E-imza & UDF"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
