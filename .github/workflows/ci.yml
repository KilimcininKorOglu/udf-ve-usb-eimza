name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (SwiftPM)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build
        run: swift build
      - name: Test
        run: swift test --no-parallel

  lint:
    name: Lint and format
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install tools
        run: brew install swiftlint swift-format
      # --strict fails on warnings; the repo config pins cyclomatic_complexity at 10.
      - name: SwiftLint
        run: swiftlint lint --strict Sources App Tests
      - name: swift-format
        run: swift-format lint --recursive --parallel Sources App Tests

  app:
    name: App build (macOS and iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build macOS
        run: >
          xcodebuild -project SignBridgeApp.xcodeproj -scheme SignBridgeApp
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Build iOS
        run: >
          xcodebuild -project SignBridgeApp.xcodeproj -scheme SignBridgeApp
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
